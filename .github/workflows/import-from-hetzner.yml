name: Import the site from Hetzner (one-off)

# Copies the live files of veridact.net from the Hetzner web host into public/, then deletes this workflow.
# It asks the Hetzner server directly (167.235.125.76), not through Cloudflare.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-from-hetzner.yml']
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download the live files
        run: |
          set -euo pipefail
          files="index.html valet/index.html media/poster.jpg media/shot-fitness.jpg media/shot-present.jpg media/veridact-explainer-v2.mp4 valet/media/valet-explainer.mp4 valet/media/valet-poster.jpg"
          for f in $files; do
            mkdir -p "public/$(dirname "$f")"
            curl -fsS --retry 3 --resolve veridact.net:443:167.235.125.76 -o "public/$f" "https://veridact.net/$f"
            echo "$f $(stat -c %s "public/$f") bytes"
          done
      - name: Commit them
        run: |
          git rm -q .github/workflows/import-from-hetzner.yml
          git add public
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Import the live site from Hetzner"
          git push
