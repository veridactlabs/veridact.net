name: Build and deploy veridact.net

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The docs come from veridactlabs/veridact and veridactlabs/veridact-valet.
  # Those repos can trigger a rebuild with a repository_dispatch (see contrib/notify-site.yml);
  # the daily run catches anything else.
  repository_dispatch:
    types: [docs-updated]
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
